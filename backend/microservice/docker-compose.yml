# For local development, only database is running
#
# docker compose up -d
# uvicorn app.main:app --reload
#
version: '3'
services:
  api:
    container_name: example_api
    env_file:
      - env/docker.env
    image: "example-api"
    build: 
      args:
        CONTEXT: local
      context: .
      dockerfile: infra/docker/gcp.Dockerfile
    # Run this contain as if it's in the terminal, useful for debugging
    tty: true
    # Mount local files into the container so we can update files inside the container
    volumes:
      - ./python:/code/python
    expose:
      - "8000"
    ports:
      - 0.0.0.0:8000:8000
    depends_on:
      - postgres_db

  postgres_db:
    container_name: example_db
    restart: unless-stopped
    image: postgres:15
    volumes:
      - ./scripts/create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/create-multiple-postgresql-databases.sh
      - ./scripts:/code/scripts
      - postgres_db:/var/lib/postgresql/data
    environment:
      - POSTGRES_MULTIPLE_DATABASES=example_db,test_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    env_file:
      - env/docker.env
    ports:
      - "0.0.0.0:5432:5432"
    expose:
      - "5432"

volumes:
  postgres_db:
