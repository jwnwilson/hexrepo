# For local development, only database is running
#
# docker compose up -d
# uvicorn app.main:app --reload
#
version: '3'
services:
  api:
    container_name: {{cookiecutter.project_slug}}
    env_file:
      - env/docker.env
    image: "{{cookiecutter.project_slug}}"
    build: 
      args:
        CONTEXT: local
      context: ../../
      dockerfile: projects/{{cookiecutter.project_slug}}/infra/docker/common.Dockerfile
    # Run this contain as if it's in the terminal, useful for debugging
    tty: true
    # Mount local files into the container so we can update files inside the container
    volumes:
      - ./libs:/libs
      - ./projects/example/src:/code/src
    expose:
      - "8000"
    ports:
      - 0.0.0.0:8000:8000
    depends_on:
      - postgres_db

  postgres_db:
    container_name: {{cookiecutter.project_slug}}_db
    restart: unless-stopped
    image: postgres:15
    volumes:
      - ./tools/create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/create-multiple-postgresql-databases.sh
      - ./tools:/code/tools
      - postgres_db:/var/lib/postgresql/data
    environment:
      - POSTGRES_MULTIPLE_DATABASES={{cookiecutter.project_slug}}_db,test_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    env_file:
      - env/docker.env
    ports:
      - "0.0.0.0:5432:5432"
    expose:
      - "5432"

volumes:
  postgres_db:
