[tool.poetry]
name = "microservice"
version = "0.1.0"
description = ""
authors = ["Noel Wilson <jwnwilson@hotmail.co.uk>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.3"
uvicorn = "^0.32.0"
requests = "^2.32.3"
python-dotenv = "^1.0.1"
sqlalchemy = "^2.0.36"
pydantic-settings = "^2.6.0"
psycopg2 = "^2.9.10"
alembic = "^1.13.3"
gevent = "^24.10.3"

[tool.poetry.group.dev.dependencies]
monorepo-storage = { path = "../libs/src/adaptor/storage", develop = true }
pytest = "^8.3.3"
mypy = "^1.13.0"
black = "^24.10.0"
isort = "^5.13.2"
httpx = "^0.27.2"
pytest-dotenv = "^0.5.2"
pytest-cov = "^6.0.0"
pytest-xdist = "^3.6.1"
polyfactory = "^2.17.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "-vv --cov --cov-report xml --cov-report term-missing --cov-fail-under=50"
asyncio_mode = "auto"
testpaths = ["app/tests"]
env_files = ["env/local.env"]

[tool.coverage.run]
concurrency = ["gevent"]
omit = ["app/tests/*"]
source = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
