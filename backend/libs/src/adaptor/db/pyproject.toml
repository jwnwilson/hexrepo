[tool.poetry]
name = "monorepo_db"
version = "0.1.0"
description = "A short description of the project"
authors = ["Noel Wilson <jwnwilson@hotmail.co.uk>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.9.2"
pydantic-settings = "^2.6.1"
psycopg2-binary = "^2.9.10"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
mypy = "^1.13.0"
black = "^24.10.0"
isort = "^5.13.2"
httpx = "^0.27.2"
pytest-dotenv = "^0.5.2"
pytest-cov = "^6.0.0"
pytest-xdist = "^3.6.1"
gevent = "^24.10.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "-vv --cov --cov-report xml --cov-report term-missing --cov-fail-under=50"
asyncio_mode = "auto"
testpaths = ["app/tests"]
env_files = ["env/local.env"]

[tool.coverage.run]
concurrency = ["gevent"]
omit = ["app/tests/*"]
source = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true