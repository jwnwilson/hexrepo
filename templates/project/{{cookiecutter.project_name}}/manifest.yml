features:
  - name: sql
    enabled: {{cookiecutter.use_db}}
    resources:
      - src/app/adaptor/db
  - name: storage
    enabled: {{cookiecutter.use_storage}}
    resources:
      - src/app/adaptor/cloud
  - name: api
    enabled: {{cookiecutter.use_api}}
    resources:
      - src/app/interactor/api
      - src/tests/interactor/api
