features:
  - name: sql
    enabled: {{cookiecutter.use_db_logic == 'sql'}}
    resources:
      - src/app/adaptor/db/sql
  - name: nosql
    enabled: {{cookiecutter.use_db_logic == 'nosql'}}
    resources:
      - src/app/adaptor/db/nosql
  - name: storage
    enabled: {{cookiecutter.use_cloud}}
    resources:
      - src/app/adaptor/cloud
  - name: api
    enabled: {{cookiecutter.use_api}}
    resources:
      - src/app/interactor/api
      - src/tests/interactor/api
