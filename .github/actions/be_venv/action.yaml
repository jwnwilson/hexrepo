name: 'Python cache'
description: 'Cache Python dependencies'
inputs:
  venv_path: 
    description: 'Path to the virtual environment'
    required: true
runs:
  using: "composite"
  steps:
    - name: Install poetry
      run: pipx install poetry
      shell: bash
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'poetry'
    - name: Cache cli venv
      id: cache-cli-poetry
      uses: actions/cache@v3
      env:
        cache-name: cache-cli-poetry
      with:
        path: .venv
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles( 'poetry.lock' ) }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
    - name: Cache lib venv
      id: cache-lib-poetry
      uses: actions/cache@v3
      env:
        cache-name: cache-lib-poetry
      with:
        path: "${{ inputs.venv_path }}/.venv"
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ inputs.venv_path }}-${{ hashFiles( env.POETRY_LOCK_FILE ) }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-${{ inputs.venv_path }}-