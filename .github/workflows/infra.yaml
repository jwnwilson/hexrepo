# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Shared Infra

on:
  push:
    branches: [ main ]
    paths:
      - libs/infra/**
  pull_request:
    branches: [ main ]
    paths:
      - libs/infra/**

env:
  # Setting an environment variable with the value of a configuration variable
  TF_VAR_aws_account: ${{ vars.AWS_ACCOUNT }}
  TF_VAR_aws_region: ${{ vars.AWS_DEFAULT_REGION }}
  TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
  TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_STATE_BUCKET: ${{ vars.AWS_TF_STATE_BUCKET }}
  TF_STATE_REGION: ${{ vars.AWS_DEFAULT_REGION }}

jobs:
  plan_shared_infra:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_DEFAULT_REGION }}
    - id: python_venv
      name: Cache venv
      uses: ./.github/actions/be_venv
      with:
        venv_path: "."
        poetry_lock_file: "./poetry.lock"
    - name: Plan Infra
      run: make shared_infra_plan
  apply_shared_infra:
    environment: production
    needs: plan_shared_infra
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_DEFAULT_REGION }}
    - id: python_venv
      name: Cache venv
      uses: ./.github/actions/be_venv
      with:
        venv_path: "."
        poetry_lock_file: "./poetry.lock"
    - name: Apply Infra
      run: make shared_infra_apply
  plan_env_infra:
    strategy:
      matrix:
        env:
        - "prod"
    runs-on: ubuntu-latest
    needs: apply_shared_infra
    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_DEFAULT_REGION }}
    - id: python_venv
      name: Cache venv
      uses: ./.github/actions/be_venv
      with:
        venv_path: "."
        poetry_lock_file: "./poetry.lock"
    - name: Plan Env Infra
      run: make env_infra_plan ENV="${{ matrix.env }}"
  apply_env_infra:
    strategy:
      matrix:
        env:
        - "prod"
    environment: production
    needs: plan_env_infra
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_DEFAULT_REGION }}
    - id: python_venv
      name: Cache venv
      uses: ./.github/actions/be_venv
      with:
        venv_path: "."
        poetry_lock_file: "./poetry.lock"
    - name: Apply Env Infra
      run: make env_infra_apply ENV="${{ matrix.env }}"