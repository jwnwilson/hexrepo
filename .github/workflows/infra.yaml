# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Shared Infra

on:
  push:
    branches: [ main ]
  #   paths:
  #     - libs/infra/**
  # pull_request:
  #   branches: [ main ]
  #   paths:
  #     - libs/infra/**

permissions:
  contents: read

jobs:
  test_infra:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - id: python_venv
      name: Cache venv
      uses: ./.github/actions/be_venv
      with:
        venv_path: "."
        poetry_lock_file: "./poetry.lock"
    - name: Plan Infra
      run: make shared_infra_plan
  apply_infra:
    environment: production
    needs: test_infra
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - id: python_venv
      name: Cache venv
      uses: ./.github/actions/be_venv
      with:
        venv_path: "."
        poetry_lock_file: "./poetry.lock"
    - name: Apply Infra
      run: make shared_infra_apply