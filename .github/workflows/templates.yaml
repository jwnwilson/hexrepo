# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Templates Test & Deploy

on:
  push:
    branches: [ main ]
    paths:
      - templates/**
  pull_request:
    branches: [ main ]
    paths:
      - templates/**

permissions:
  contents: read

jobs:
  test_templates:
    strategy:
      matrix:
        template:
        - "tools/hecli"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - id: python_venv
      name: Cache project venv
      uses: ./.github/actions/be_venv
      with:
        venv_path: ${{ matrix.template }}
        poetry_lock_file: "${{ matrix.template }}/poetry.lock"
    - name: Test Templates
      run: |
        cd ${{ matrix.template }}
        make test
  