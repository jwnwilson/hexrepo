# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Projects Test & Deploy

on:
  push:
    branches: [ main ]
    paths:
      - projects/**
  pull_request:
    branches: [ main ]
    paths:
      - projects/**

env:
  # Setting an environment variable with the value of a configuration variable
  TF_VAR_AWS_ACCOUNT: ${{ vars.AWS_ACCOUNT }}
  TF_VAR_AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
  TF_VAR_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  TF_VAR_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}


jobs:
  plan_infra:
    environment: production
    strategy:
      matrix:
        project:
        - "projects/aipet_fe"
        env:
          - "default"
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check_modified.outputs.skip }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - id: python_venv
      name: Cache project venv
      uses: ./.github/actions/be_venv
      with:
        lock_file: "${{ matrix.project }}/uv.lock"
    - name: Check Project Modified
      id: check_modified
      run: |
       set +e
        export PROJ=`basename "${{ matrix.project }}"`
        make check_project_modified PROJECT=${PROJ}
        if [ $? -ne 0 ]; then
            echo "Setting skip = false"
            echo "skip=false" >> $GITHUB_OUTPUT
        else
            echo "Setting skip = true"
            echo "skip=true" >> $GITHUB_OUTPUT
        fi
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      if: steps.check_modified.outputs.skip == 'false'
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_DEFAULT_REGION }}
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      if: steps.check_modified.outputs.skip == 'false'
      with:
          terraform_version: "^1.3.7"
          terraform_wrapper: false
    - name: Infra plan
      if: steps.check_modified.outputs.skip == 'false'
      run: |
        export PROJ=`basename "${{ matrix.project }}"`
        make infra_plan_project PROJECT=${PROJ} ENV=${{ matrix.env }}
  deploy:
    needs: plan_infra
    strategy:
      matrix:
        project:
          - "projects/aipet_fe"
        env:
          - "default"
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup node
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Install
        working-directory: ${{ matrix.project }}
        run: npm i -g pnpm && pnpm i && pnpm build
      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Sync files to S3 bucket
        working-directory: ${{ matrix.project }}
        run: |
          aws s3 sync dist s3://aipet.jwnwilson.co.uk --delete
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ vars.DISTRIBUTION_ID }} --paths '/*'
