# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Library Test & Deploy

on:
  push:
    branches: [ main ]
    paths:
      - libs/**
  pull_request:
    branches: [ main ]
    paths:
      - libs/**

env:
  # Setting an environment variable with the value of a configuration variable
  AWS_ACCOUNT: ${{ vars.AWS_ACCOUNT }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  MONOREPO_LIB_REPO_URL: ${{ vars.MONOREPO_LIB_REPO_URL }}
  MONOREPO_LIB_REPO_USERNAME: ${{ vars.MONOREPO_LIB_REPO_USERNAME }}
  MONOREPO_LIB_REPO_PASSWORD: ${{ secrets.MONOREPO_LIB_REPO_PASSWORD }}

permissions:
  contents: read

jobs:
  test_libs:
    strategy:
      matrix:
        library:
        - "libs/adaptor/db"
        # - "libs/adaptor/cloud"
        # - "libs/interactor/api"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - id: python_venv
      name: Cache project venv
      uses: ./.github/actions/be_venv
      with:
        lock_file: "${{ matrix.library }}/uv.lock"
    - name: Test Library
      working-directory: ${{ matrix.library }}
      run: |
        make lint
        make db
        sleep 5
        docker ps
        make test
  check_version_bump:
    strategy:
      matrix:
        library:
        - "libs/adaptor/db"
        - "libs/adaptor/cloud"
        - "libs/interactor/api"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - id: python_venv
      name: Cache project venv
      uses: ./.github/actions/be_venv
      with:
        lock_file: "${{ matrix.library }}/uv.lock"
    - name: Check Version Bump Needed
      run: |
        export LIB=`basename "${{ matrix.library }}"`
        make check_version_bump LIBRARY=${LIB}
  deploy_libs:
    needs: test_libs
    strategy:
      matrix:
        library:
        - "libs/adaptor/db"
        - "libs/adaptor/cloud"
        - "libs/interactor/api"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.test_libs.result == 'success'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - id: python_venv
      name: Cache project venv
      uses: ./.github/actions/be_venv
      with:
        lock_file: "${{ matrix.library }}/uv.lock"
    - name: Deploy Library
      run: |
        export LIB=`basename "${{ matrix.library }}"`
        make deploy_libs_check_modified LIBRARY=${LIB}
    
