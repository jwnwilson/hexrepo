# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Backend Libs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test_libs:
    strategy:
      matrix:
        library: ["db", "storage", "api"]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install poetry
      run: pipx install poetry
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'poetry'
    - name: Cache cli venv
      id: cache-cli-poetry
      uses: actions/cache@v3
      env:
        cache-name: cache-cli-poetry
      with:
        path: ./.venv
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-
    - name: Test Library
      run: make test_be_libs LIBRARY=${{ matrix.library }}
    - name: Deploy Library
      run: make deploy_be_libs LIBRARY=${{ matrix.library }} --check_modified