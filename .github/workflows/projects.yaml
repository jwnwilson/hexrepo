# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Projects Test & Deploy

on:
  push:
    branches: [ main ]
    # paths:
    #   - libs/**
    #   - projects/**
  pull_request:
    branches: [ main ]
    # paths:
    #   - libs/**
    #   - projects/**

env:
  # Setting an environment variable with the value of a configuration variable
  TF_VAR_AWS_ACCOUNT: ${{ vars.AWS_ACCOUNT }}
  TF_VAR_AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
  TF_VAR_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  TF_VAR_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}


jobs:
  test_projects:
    strategy:
      matrix:
        project:
        - "projects/example"
        - "projects/monitor"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - id: python_venv
      name: Cache project venv
      uses: ./.github/actions/be_venv
      with:
        venv_path: ${{ matrix.project }}
        poetry_lock_file: "${{ matrix.project }}/poetry.lock"
    - name: Test Projects
      run: |
        cd ${{ matrix.project }}
        make test
  plan_infra:
    needs: test_projects
    strategy:
      matrix:
        project:
        - "projects/example"
        - "projects/monitor"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_DEFAULT_REGION }}
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
          terraform_version: "^1.3.7"
          terraform_wrapper: false
    - name: Infra plan
      run: |
        cd ${{ matrix.project }}
        make tf_init
        make tf_plan
  deploy_projects:
    environment: production
    needs: plan_infra
    if: github.ref == 'refs/heads/main' && needs.plan_infra.result == 'success'
    strategy:
      matrix:
        project:
        - "projects/example"
        - "projects/monitor"
        env:
        - "default"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_DEFAULT_REGION }}
    - id: python_venv
      name: Cache project venv
      uses: ./.github/actions/be_venv
      with:
        venv_path: ${{ matrix.project }}
        poetry_lock_file: "${{ matrix.project }}/poetry.lock"
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
          terraform_version: "^1.3.7"
          terraform_wrapper: false
    - name: DB migration
      shell: bash
      run: |
        export PROJ=`basename "${{ matrix.project }}"`
        make migrate_db PROJECT=${PROJ} ENV=${{ matrix.env }} 
    - name: Deploy Project
      shell: bash
      run: |
        cd ${{ matrix.project }}
        make tf_init
        make deploy ENVIRONMENT=${{ matrix.env }}

