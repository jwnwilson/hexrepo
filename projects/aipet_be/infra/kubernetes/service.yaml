---
apiVersion: v1
kind: Service
metadata:
  name: aipet-service
  namespace: default
  labels:
    app: aipet
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: aipet

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aipet-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
  - hosts:
    - aipet-kube.jwnwilson.co.uk
    secretName: aipet-tls-secret
  rules:
  - host: aipet-kube.jwnwilson.co.uk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aipet-service
            port:
              number: 8000
