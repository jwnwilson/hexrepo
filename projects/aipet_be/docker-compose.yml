# For local development, only database is running
#
# docker compose up -d
# uvicorn app.main:app --reload
#
version: '3.8'
services:
  api:
    container_name: aipet_be
    platform: "linux/amd64"
    env_file:
      - env/docker.env
    image: "aipet_be"
    build: 
      context: ../../
      dockerfile: infra/docker/django-ninja.Dockerfile
      args:
          PROJECT: aipet_be
    # Run this contain as if it's in the terminal, useful for debugging
    tty: true
    # Mount local files into the container so we can update files inside the container
    volumes:
      - ../../libs:/libs
      - ./src:/code/src
    expose:
      - "8000"
    ports:
      - 0.0.0.0:8000:8000
    depends_on:
      - db

  db:
    container_name: aipet_be_db
    restart: unless-stopped
    image: postgres:15
    volumes:
      - ./tools/create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/create-multiple-postgresql-databases.sh
      - ./tools:/code/tools
      - postgres_db:/var/lib/postgresql/data
    environment:
      - POSTGRES_MULTIPLE_DATABASES=aipet_be_db,test_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    env_file:
      - env/docker.env
    ports:
      - "0.0.0.0:5432:5432"
    expose:
      - "5432"




volumes:
  
  postgres_db:
  
  
