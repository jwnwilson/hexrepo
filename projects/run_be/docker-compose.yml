# For local development, only database is running
#
# docker compose up -d
# uvicorn app.main:app --reload
#
version: '3.8'
services:
  api:
    container_name: run_be
    platform: "linux/amd64"
    env_file:
      - env/docker.env
    image: "run_be"
    build: 
      context: ../../
      dockerfile: infra/docker/common.Dockerfile
      args:
          PROJECT: run_be
    # Run this contain as if it's in the terminal, useful for debugging
    tty: true
    # Mount local files into the container so we can update files inside the container
    volumes:
      - ../../libs:/libs
      - ./src:/code/src
    expose:
      - "8000"
    ports:
      - 0.0.0.0:8000:8000
    
    depends_on:
      - db
    
    


  db:
    container_name: run_be_db
    restart: unless-stopped
    image: postgres:15
    volumes:
      - ./tools/create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/create-multiple-postgresql-databases.sh
      - ./tools:/code/tools
      - postgres_db:/var/lib/postgresql/data
    environment:
      - POSTGRES_MULTIPLE_DATABASES=run_be_db,test_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    env_file:
      - env/docker.env
    ports:
      - "0.0.0.0:5432:5432"
    expose:
      - "5432"


  localstack:
    container_name: "run_be-localstack"
    image: localstack/localstack
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    environment:
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - DEBUG=${DEBUG:-0}
      - PERSISTENCE=1
    volumes:
      - localstack:/var/lib/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"



volumes:
  
  postgres_db:
  
  
  localstack:
  
