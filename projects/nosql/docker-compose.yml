# For local development, only database is running
#
# docker compose up -d
# uvicorn app.main:app --reload
#
version: '3'
services:
  api:
    container_name: nosql
    platform: "linux/amd64"
    env_file:
      - env/docker.env
    image: "nosql"
    build: 
      context: ../../
      dockerfile: infra/docker/aws.Dockerfile
      args:
          PROJECT: nosql
    # Run this contain as if it's in the terminal, useful for debugging
    tty: true
    # Mount local files into the container so we can update files inside the container
    volumes:
      - ../../libs:/libs
      - ./src:/code/src
    expose:
      - "8000"
    ports:
      - 0.0.0.0:8000:8000
    depends_on:
      - db
    # Override lambda entry point to revert to default docker behaviour
    entrypoint: ""
    command: "uvicorn app.adapter.into.fastapi.main:app --host 0.0.0.0 --port 80 --reload --debug"

  db:
    container_name: monorepo_dynamodb
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data -port 8888"
    image: "amazon/dynamodb-local:latest"
    ports:
      - "0.0.0.0:8888:8888"
    expose:
      - "8888"
    working_dir: /home/dynamodblocal
    volumes:
     - ./db_data:/home/dynamodblocal/data


volumes:
  dynamo_db:
