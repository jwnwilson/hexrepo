# For local development, only database is running
#
# docker compose up -d
# uvicorn app.main:app --reload
#
version: '3'
services:
  api:
    container_name: common
    platform: "linux/amd64"
    env_file:
      - env/docker.env
    image: "common"
    build: 
      context: ../../
      dockerfile: infra/docker/common.Dockerfile
      args:
        PROJECT: common
    # Run this contain as if it's in the terminal, useful for debugging
    tty: true
    # Mount local files into the container so we can update files inside the container
    volumes:
      - ../../libs:/libs
      - ./src:/code/src
    expose:
      - "8000"
    ports:
      - 0.0.0.0:8000:8000
    depends_on:
      - db
    # command: "uvicorn app.interactor.api.fastapi.main:app --host 0.0.0.0 --port 8000 --reload"

  celery:
    container_name: common-celery
    platform: "linux/amd64"
    env_file:
      - env/docker.env
    image: "common"
    # Run this contain as if it's in the terminal, useful for debugging
    tty: true
    # Mount local files into the container so we can update files inside the container
    volumes:
      - ../../libs:/libs
      - ./src:/code/src
    depends_on:
      - db
      - localstack
    command: "celery -A app.interactor.event.celery.celery_app worker --loglevel=info"

  lambda:
    container_name: common-lambda
    platform: "linux/amd64"
    env_file:
      - env/docker.env
    image: "common-lambda"
    build: 
      context: ../../
      dockerfile: infra/docker/lambda.Dockerfile
      args:
        PROJECT: common
    # Run this contain as if it's in the terminal, useful for debugging
    tty: true
    # Mount local files into the container so we can update files inside the container
    volumes:
      - ../../libs:/libs
      - ./src:/code/src

  db:
    container_name: common_db
    restart: unless-stopped
    image: postgres:15
    volumes:
      - ./tools/create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/create-multiple-postgresql-databases.sh
      - ./tools:/code/tools
      - postgres_db:/var/lib/postgresql/data
    environment:
      - POSTGRES_MULTIPLE_DATABASES=common_db,test_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    env_file:
      - env/docker.env
    ports:
      - "0.0.0.0:5432:5432"
    expose:
      - "5432"

  localstack:
    container_name: "common-localstack"
    image: localstack/localstack
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    environment:
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - DEBUG=${DEBUG:-0}
      - PERSISTENCE=1
    volumes:
      - localstack:/var/lib/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"

  cache:
    container_name: core_cache
    image: redis:6.2-alpine
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning
    volumes: 
      - cache:/data

  temporal-worker:
    platform: "linux/amd64"
    env_file:
      - env/docker.env
    image: "core_api:${DOCKER_TAG:-latest}"
    # Run this container as if it's in the terminal, useful for debugging
    tty: true
    # Mount local files into the container so we can update files inside the container
    volumes:
      - ../../libs:/libs
      - ./src:/code/src
    command: "python -m app.interactor.event.temporal.worker"
    depends_on:
      - temporal
      - cache
      - db

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      - db
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=password
      - POSTGRES_SEEDS=db
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    ports:
      # gRPC port for workers and clients
      - "7233:7233"
    expose:
      - "7233"
    volumes:
      - ./temporal_config:/etc/temporal/config/dynamicconfig

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    expose:
      - "8080"

  temporal-admin-tools:
    image: temporalio/admin-tools:latest
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    stdin_open: true
    tty: true

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false   # set to true in production
    ports:
      - "9200:9200"
    expose:
      - "9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_db:
  localstack:
  cache:
  es_data:

