[project]
name = "pyspark_example"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "delta-spark>=3.5.0",
    "grpcio>=1.78.0",
    "grpcio-status>=1.78.0",
    "pyspark>=3.5",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = [
  "src"
]
asyncio_mode = "auto"  # Automatically handle async tests
asyncio_default_fixture_loop_scope = "function" 

[tool.coverage.run]
concurrency = ["thread"]
omit = ["src/tests/*"]
source = ["src"]

