[project]
authors = [
    {name = "Noel Wilson", email = "jwnwilson@hotmail.co.uk"},
]
requires-python = "<4.0,>=3.12"
name = "hexrepo_db"
version = "0.1.26"
description = "A short description of the project"
readme = "README.md"
dependencies = [
    "pydantic<3.0.0,>=2.9.2",
    "pydantic-settings<3.0.0,>=2.6.1",
    "boto3<2.0.0,>=1.35.68",
    "boto3-stubs[essential]<2.0.0,>=1.35.86",
    "hexrepo-cloud",
    "loguru>=0.7.3",
]

[tool.uv.sources]
hexrepo-cloud = { path = "../cloud", editable = true }

[dependency-groups]
sql = [
    "psycopg[binary]==3.2.6",
    "sqlalchemy<3.0.0,>=2.0.36",
    "alembic<2.0.0,>=1.14.0",
]
mongo = [
    "pymongo>=4.10.1",
]
dev = [
    "pytest<9.0.0,>=8.3.3",
    "mypy<2.0.0,>=1.13.0",
    "ruff>=0.8.4",
    "httpx<1.0.0,>=0.27.2",
    "pytest-dotenv<1.0.0,>=0.5.2",
    "pytest-cov<7.0.0,>=6.0.0",
    "pytest-xdist<4.0.0,>=3.6.1",
    "gevent<25.0.0,>=24.10.3",
]

[tool.pdm.build]
includes = []
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pytest.ini_options]
addopts = "-vv --cov --cov-report xml --cov-report term-missing --cov-fail-under=50"
asyncio_mode = "auto"
testpaths = ["tests"]
env_files = ["env/local.env"]

[tool.coverage.run]
concurrency = ["gevent"]
omit = ["tests/*"]
source = ["hexrepo_db"]

[tool.mypy]
python_version = "3.12"
strict = true
implicit_reexport = false
plugins = ['pydantic.mypy']
