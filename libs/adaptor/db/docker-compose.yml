# For local development, only database is running
#
# docker compose up -d
# uvicorn app.main:app --reload
#
version: '3'
services:
  postgres_db:
    container_name: monorepo_db
    restart: unless-stopped
    image: postgres:15
    volumes:
      - postgres_db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=monorepo_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "0.0.0.0:5432:5432"
    expose:
      - "5432"

volumes:
  postgres_db:
