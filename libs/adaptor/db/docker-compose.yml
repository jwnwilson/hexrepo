# For local development, only database is running
#
# docker compose up -d
# uvicorn app.main:app --reload
#
version: '3'
services:
  postgres_db:
    container_name: monorepo_db
    restart: unless-stopped
    image: postgres:15
    environment:
      - POSTGRES_DB=monorepo_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "0.0.0.0:5432:5432"
    expose:
      - "5432"
  dynamodb-local:
    container_name: monorepo_dynamodb
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    image: "amazon/dynamodb-local:latest"
    ports:
      - "0.0.0.0:8000:8000"
    expose:
      - "8000"
    working_dir: /home/dynamodblocal
    volumes:
     - "./docker/dynamodb:/home/dynamodblocal/data"
  mongodb:
    container_name: monorepo_mongo
    image: mongo:latest
    ports:
      - '0.0.0.0:27017:27017'
    expose:
      - "27017"
    restart: always
    volumes:
      - ./tests/test_data/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
