# For local development, only database is running
#
# docker compose up -d
# uvicorn app.main:app --reload
#
version: '3'
services:
  postgres_db:
    container_name: hexrepo_db
    restart: unless-stopped
    image: postgres:15
    environment:
      - POSTGRES_DB=hexrepo_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "0.0.0.0:5432:5432"
    expose:
      - "5432"
  dynamodb-local:
    container_name: "hexrepo-db-localstack"
    image: localstack/localstack
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    environment:
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - DEBUG=${DEBUG:-0}
    volumes:
      - localstack:/var/lib/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"
  mongodb:
    container_name: hexrepo_mongo
    image: mongo:latest
    ports:
      - '0.0.0.0:27017:27017'
    expose:
      - "27017"
    restart: unless-stopped
    volumes:
      - ./tests/test_data/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

volumes:
  localstack: