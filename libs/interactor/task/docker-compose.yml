# For local development, only database is running
#
# docker compose up -d
# uvicorn app.main:app --reload
#
version: '3'
services:
  db:
    container_name: hexorepo_task_dynamodb
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data -port 8888"
    image: "amazon/dynamodb-local:latest"
    ports:
      - "0.0.0.0:8888:8888"
    expose:
      - "8888"
    working_dir: /home/dynamodblocal
    volumes:
     - ./db_data:/home/dynamodblocal/data


volumes:
  dynamo_db:
